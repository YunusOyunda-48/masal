<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İyi ki Doğdun!</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-CVVIQydY.js?v=4"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DvwkFBmH.css?v=4">
    <style>
      .late-screen {
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        z-index: 200;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: opacity 1s ease, visibility 1s ease;
      }
      .late-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .late-content h2 {
        font-size: 2.5rem;
        color: var(--primary-color);
        margin-bottom: 30px;
        animation: dropIn 1s ease forwards;
      }
      .start-btn {
        background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
        border: none;
        padding: 15px 30px;
        color: white;
        font-family: 'Outfit', sans-serif;
        font-size: 1.2rem;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(255, 117, 140, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        animation: fadeInBtn 2s ease forwards;
      }
      .start-btn:hover {
        transform: scale(1.05) translateY(-3px);
        box-shadow: 0 15px 25px rgba(255, 117, 140, 0.4);
      }
      @keyframes dropIn {
        from { transform: translateY(-50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes fadeInBtn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Prevent loader animations until button click */
      #loader .date-text, #loader .loading-bar {
        animation: none !important;
        opacity: 0;
      }
      #loader.start-anim .date-text {
        animation: 2s forwards revealDate !important;
      }
      #loader.start-anim .loading-bar {
        animation: 2.5s forwards loadBar !important;
      }
    </style>
  </head>
  <body>
    <!-- Late Screen Overlay -->
    <div id="lateScreen" class="late-screen">
      <div class="late-content">
        <h2>Parti bitti galiba, geç kaldın</h2>
        
        <div class="message-box" style="margin-top: 20px; margin-bottom: 30px; text-align: center;">
          <textarea id="userMessage" placeholder="Bir şeyler yazmak ister misin?" style="width: 100%; max-width: 300px; height: 80px; border-radius: 10px; padding: 10px; font-family: Outfit; resize: none; border: 1px solid var(--primary-color); background: rgba(255,255,255,0.1); color: white; margin-bottom: 10px;"></textarea>
          <br>
          <button id="sendLetterBtn" class="start-btn" style="font-size: 1rem; padding: 10px 20px;">Mektubu İlet</button>
        </div>

        <button id="startAnywayBtn" class="start-btn">Yine de siteye git</button>
      </div>
    </div>

    <!-- Loading Screen (Date Reveal) -->
    <div id="loader" class="loader">
      <div class="loader-content">
        <div class="date-text" id="dateText">1 Ocak 2026</div>
        <div class="loading-bar"></div>
      </div>
    </div>

    <!-- Background Elements -->
    <div class="background-glow"></div>
    <div class="fireflies"></div>

    <!-- Corner Flowers -->
    <div class="flower top-left">🌸</div>
    <div class="flower top-right">🌺</div>
    <div class="flower bottom-left">🌷</div>
    <div class="flower bottom-right">🌻</div>

    <!-- Main Content -->
    <main>
      <!-- Hero Section -->
      <section class="hero-section">
        <div class="hero-content">
          <h1 class="title">İyi ki<br>Doğdun!</h1>
          <p class="subtitle">Masal'a özel hazırlandı...</p>
          
          <!-- Interactive Gift -->
          <div class="gift-container">
            <div class="gift-box" id="giftBox">
              <div class="gift-lid"></div>
              <div class="gift-body"></div>
              <div class="gift-ribbon-vertical"></div>
              <div class="gift-ribbon-horizontal"></div>
              <div class="click-me">Tıkla!</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Reveal Section (Hidden initially) -->
      <section class="reveal-section hidden" id="revealSection">
        <div class="glass-card">
          <h2 id="cardTitle">Yeni Yaşın Kutlu Olsun!</h2>
          <p class="message" id="cardMessage">
            Nice senelere, mutluluklar dilerim! Yazdan önce sınavlarının da çok iyi geçmesi dileğiyle...
          </p>
          
          <div class="photo-gallery">
            <div class="photo-frame">
              <!-- Using placeholders. User can replace in public/images/photo1.png -->
              <img src="./images/photo1.png" onerror="this.src='https://placehold.co/400x500/2a1b38/e78fb3?text=Fotograf+1'" alt="Fotoğraf 1">
              <div class="photo-pin"></div>
            </div>
            <div class="photo-frame tilt-right">
              <!-- Using placeholders. User can replace in public/images/photo2.png -->
              <img src="./images/photo2.png" onerror="this.src='https://placehold.co/400x500/2a1b38/e78fb3?text=Fotograf+2'" alt="Fotoğraf 2">
              <div class="photo-pin"></div>
            </div>
          </div>

          <div class="scroll-indicator">
            <p>Daha fazlası için kaydır</p>
            <div class="arrow">↓</div>
          </div>
        </div>
      </section>

      <!-- Extra Scroll Content -->
      <section class="extra-section hidden" id="extraSection">
        <div class="cake-container">
          <div class="cake">
            <div class="candle">
              <div class="flame"></div>
            </div>
            <div class="cake-top"></div>
            <div class="cake-middle"></div>
            <div class="cake-bottom"></div>
          </div>
          <h3>Doğum Günün Kutlu Olsun!</h3>
        </div>
      </section>

    </main>

  </body>
</html>
